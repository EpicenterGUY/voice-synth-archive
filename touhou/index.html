<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>TouhouDive — 동방 원곡 탐색</title>
  <meta name="description" content="동방 프로젝트 공식 원곡을 작품·캐릭터·분위기·시대 흐름으로 깊게 탐색하는 VocaDive 계열 앱." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">東</div>
        <div>
          <strong>TouhouDive</strong>
          <span>Original Music Explorer</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item is-active" data-view="home">⌂ <span>홈</span></button>
        <button class="nav-item" data-view="dive">⌁ <span>다이브</span></button>
        <button class="nav-item" data-view="works">▦ <span>작품별</span></button>
        <button class="nav-item" data-view="library">♡ <span>보관함</span></button>
        <button class="nav-item" data-view="history">◷ <span>기록</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="origin-chip">ZUN 원곡 ONLY</div>
        <button id="themeBtn" class="ghost-btn">☼ 테마 전환</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
        <div class="searchbox">
          <span>⌕</span>
          <input id="searchInput" placeholder="곡명 · 작품 · 캐릭터 검색" autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <button class="random-btn" id="randomBtn">랜덤 다이브</button>
      </header>

      <section class="hero">
        <div>
          <div class="eyebrow">VocaDive shared DNA · Touhou original focus</div>
          <h1>한 곡에서 시작해<br><em>환상향 깊숙이.</em></h1>
          <p>공식 원곡을 중심으로 작품, 보스/스테이지, 시대, 분위기를 따라 이어서 탐색합니다. 어레인지는 별도 계층으로 분리할 예정입니다.</p>
          <div class="hero-actions">
            <button class="primary-btn" id="heroDiveBtn">원곡에서 다이브</button>
            <button class="secondary-btn" id="surpriseBtn">숨은 원곡 추천</button>
          </div>
        </div>
        <div class="hero-orb" aria-hidden="true">
          <div class="orb-ring r1"></div><div class="orb-ring r2"></div><div class="orb-core">幻想</div>
        </div>
      </section>

      <section class="quick-filters" id="quickFilters"></section>

      <section class="content-section">
        <div class="section-head">
          <div>
            <span class="eyebrow">오늘의 입구</span>
            <h2 id="sectionTitle">원곡 추천</h2>
          </div>
          <button class="text-btn" id="refreshBtn">추천 새로고침 ↻</button>
        </div>
        <div class="track-grid" id="trackGrid"></div>
      </section>

      <section class="content-section" id="diveSection">
        <div class="section-head">
          <div>
            <span class="eyebrow">RELATION MAP</span>
            <h2>다이브 흐름</h2>
          </div>
          <span class="hint">곡을 누르면 연결 근거가 바뀝니다</span>
        </div>
        <div id="diveMap" class="dive-map empty-state">
          <strong>아직 시작곡이 없습니다.</strong>
          <span>추천곡이나 검색 결과에서 한 곡을 골라보세요.</span>
        </div>
      </section>
    </main>

    <aside class="detail-panel" id="detailPanel" aria-hidden="true">
      <button class="panel-close" id="panelClose" aria-label="닫기">×</button>
      <div id="detailContent"></div>
    </aside>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
