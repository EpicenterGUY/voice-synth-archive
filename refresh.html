<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>VocaDive 새 버전 적용</title>
<style>
html,body{margin:0;min-height:100%;background:#041115;color:#e9fbf7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(420px,100%);padding:22px;border:1px solid #28555b;border-radius:20px;background:#081d22;box-sizing:border-box}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden}.logo img{display:block;width:100%;height:100%;object-fit:cover}
h1{margin:14px 0 8px;font-size:22px}p{margin:0;color:#82a8a4;font-size:13px;line-height:1.6}.status{margin-top:14px;padding:10px 12px;border:1px solid #21474d;border-radius:12px;background:#06191e;color:#9bd0ca;font-size:12px}
</style>
</head>
<body>
<main><section class="card"><div class="logo"><img src="./icons/app-icon.svg" alt=""></div><h1>VocaDive 업데이트 적용 중</h1><p>곡 보관함과 취향 데이터는 유지하고, 오래된 앱 캐시와 서비스워커만 정리합니다.</p><div class="status" id="status">캐시 정리 중…</div></section></main>
<script>
(async()=>{
  const status=document.getElementById("status");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const names=await caches.keys();
      await Promise.all(names.filter(n=>n.startsWith("voice-synth-archive-shell-")).map(n=>caches.delete(n)));
    }
    sessionStorage.setItem("vsa.hardRefresh","39.8.0");
    status.textContent="정리 완료 · 최신 화면을 여는 중…";
  }catch(e){
    status.textContent="캐시 정리를 마치고 최신 화면을 여는 중…";
  }
  setTimeout(()=>location.replace("./?appv=39.8.0&fresh="+Date.now()),350);
})();
</script>
</body>
</html>
