name: Android debug app bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "*.webmanifest"
      - "icons/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web bundle
        run: npm run build:app

      - name: Generate Android shell
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icon and splash assets
        run: npm run assets:android

      - name: Sync Capacitor plugins and web bundle
        run: npx cap sync android

      - name: Verify native shell
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable/splash.png || test -f android/app/src/main/res/drawable-port-hdpi/splash.png || true
          grep -R "app.vocadive.mobile" android/app/build.gradle android/app/build.gradle.kts >/dev/null 2>&1 || true

      - name: Build debug APK and AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Upload Android debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VocaDive-Android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
