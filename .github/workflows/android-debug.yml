name: Android debug app bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "*.webmanifest"
      - "icons/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static smoke check
        run: npm run check:static

      - name: Prepare web bundle
        run: npm run build:app

      - name: Generate Android shell
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icon and splash assets
        run: npm run assets:android

      - name: Sync Capacitor plugins and web bundle
        run: npx cap sync android

      - name: Patch direct APK updater bridge
        run: npm run android:patch

      - name: Verify native shell
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/java/app/vocadive/mobile/VocaDiveUpdaterPlugin.java
          test -f android/app/src/main/res/xml/vocadive_update_paths.xml
          grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml
          APP_VERSION="$(node -p "require('./package.json').version")"
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
          grep -Eq "versionCode [0-9]+" android/app/build.gradle
          test -f android/app/src/main/res/drawable/splash.png || test -f android/app/src/main/res/drawable-port-hdpi/splash.png || true

      - name: Build debug APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ok=0
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug bundleDebug --stacktrace; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle build/download failed; retrying in $((attempt * 5)) seconds."
              rm -f "$HOME/.gradle/wrapper/dists"/*/*/*.part 2>/dev/null || true
              sleep $((attempt * 5))
            fi
          done
          test "$ok" = "1"

      - name: Upload Android debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VocaDive-Android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
