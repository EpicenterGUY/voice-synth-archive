name: Build Touhou full index

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"
  push:
    branches: [main]
    paths:
      - "tools/build-touhou-index.mjs"
      - ".github/workflows/touhou-full-index.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: touhou-full-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build complete TouhouDB index
        env:
          PAGE_SIZE: "100"
          SHARD_SIZE: "1000"
          CONCURRENCY: "6"
          WAIT_MS: "40"
        run: node tools/build-touhou-index.mjs

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add touhou/data/full
          if ! git diff --cached --quiet; then
            git commit -m "data(touhou): refresh full TouhouDB index"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "4" ]; then
                echo "Failed to push refreshed index after 4 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy full-index build to Pages
        id: deployment
        uses: actions/deploy-pages@v4
