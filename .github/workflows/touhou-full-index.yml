# Manual rebuild trigger: YouTube API key configured
name: Build Touhou full index

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"
  push:
    branches: [main]
    paths:
      - "tools/build-touhou-index.mjs"
      - "tools/build-touhou-fan-youtube.mjs"
      - "touhou/data/fan-originals.json"
      - "touhou/data/fan-original-albums.json"
      - ".github/workflows/touhou-full-index.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: touhou-full-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build complete TouhouDB index
        env:
          PAGE_SIZE: "100"
          SHARD_SIZE: "1000"
          CONCURRENCY: "6"
          WAIT_MS: "40"
          VIEW_CONCURRENCY: "8"
          FETCH_VIEWS: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/build-touhou-index.mjs

      - name: Match Touhou-style tracks to embeddable YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SEARCH_LIMIT: "75"
        run: node tools/build-touhou-fan-youtube.mjs

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/touhou-full /tmp/fan-youtube.json
          cp -a touhou/data/full /tmp/touhou-full
          cp touhou/data/fan-youtube.json /tmp/fan-youtube.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf touhou/data/full
            cp -a /tmp/touhou-full touhou/data/full
            cp /tmp/fan-youtube.json touhou/data/fan-youtube.json
            git add touhou/data/full touhou/data/fan-youtube.json
            if git diff --cached --quiet; then
              echo "Generated index is already current."
              break
            fi
            git commit -m "data(touhou): refresh full TouhouDB index"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "Failed to push refreshed index after 4 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy full-index build to Pages
        id: deployment
        uses: actions/deploy-pages@v4
