<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <title>음성합성 오리지널곡 통계</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07111e;color:#dff4ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{width:min(520px,100%);padding:24px;border:1px solid #29445f;border-radius:20px;background:#0b1828;text-align:center;box-shadow:0 24px 80px #0008}
    h1{font-size:20px;margin:0 0 10px}.sub{font-size:12px;color:#8da7bf;line-height:1.6}
    .bar{height:6px;margin:18px 0 9px;background:#132b42;border-radius:99px;overflow:hidden}
    .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#55cdf0,#8174ff);transition:.15s width}
    .status{font-size:11px;color:#a6bfd3;white-space:pre-wrap;line-height:1.5}.error{color:#ffb3bc}
  </style>
</head>
<body>
  <div class="boot">
    <div class="card">
      <h1>음성합성 오리지널곡 통계</h1>
      <div class="sub">앱 파일을 불러오는 중입니다.</div>
      <div class="bar"><i id="p"></i></div>
      <div class="status" id="s">준비 중…</div>
    </div>
  </div>
<script>
(async()=>{
  const PARTS=9;
  const status=document.getElementById("s");
  const bar=document.getElementById("p");

  async function loadPart(name){
    const urls=[
      `./src/index.html.gz.b64.part${name}?v=10.2.1`,
      `https://raw.githubusercontent.com/EpicenterGUY/voice-synth-archive/main/src/index.html.gz.b64.part${name}?v=10.2.1`
    ];
    let lastErr=null;
    for(const url of urls){
      try{
        const r=await fetch(url,{cache:"no-store",mode:"cors"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        return (await r.text()).trim();
      }catch(e){
        lastErr=e;
      }
    }
    throw new Error(`앱 조각 part${name}을 불러오지 못했습니다: ${lastErr?.message||lastErr}`);
  }

  try{
    if(!("DecompressionStream" in window)){
      throw new Error("이 브라우저는 압축 앱 로더를 지원하지 않습니다. 최신 Chrome/Edge/Samsung Internet에서 열어주세요.");
    }

    const chunks=[];
    for(let i=0;i<PARTS;i++){
      status.textContent=`앱 데이터 불러오는 중… ${i+1}/${PARTS}`;
      bar.style.width=`${Math.round((i/PARTS)*72)}%`;
      chunks.push(await loadPart(String(i).padStart(2,"0")));
    }

    status.textContent="앱 압축 해제 중…";
    bar.style.width="82%";

    const b64=chunks.join("").replace(/\s+/g,"");
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);

    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const appHtml=await new Response(stream).text();

    if(!/<!doctype html|<html/i.test(appHtml)){
      throw new Error("복원된 앱 파일이 올바른 HTML이 아닙니다.");
    }

    status.textContent="실행 중…";
    bar.style.width="100%";
    document.open();
    document.write(appHtml);
    document.close();
  }catch(err){
    console.error(err);
    status.className="status error";
    status.textContent="앱 실행 실패\n"+(err?.message||String(err))+"\n\nCtrl+F5로 새로고침해도 계속되면 알려주세요.";
    bar.style.width="0";
  }
})();
</script>
</body>
</html>
